# Generated by dx/scripts/ci-sync from ci-templates/go-vendored.yaml.
# Do not edit directly — change the template and re-run ci-sync.

name: CI

on:
  pull_request:
    branches: [main, test, development]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  GO_VERSION: "1.27.3"
  # Upstream tests to skip (repo-specific; empty for repos with none).
  SKIP_TESTS: ""

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse == 'true' }}
      code: ${{ steps.f.outputs.code == 'true' || steps.f.outputs.ci == 'true' }}
      is-main: ${{ steps.tier.outputs.is-main }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          # A file must match every pattern. Under the default, any one match
          # is enough, so '**' alone marks every file as code and no exclusion
          # applies.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.github/**'
              - '!.githooks/**'
              - '!.vscode/**'
              - '!LICENSE'
              - '!NOTICE'
            # The one file under .github/ that changes what these jobs run.
            ci:
              - '.github/workflows/ci.yaml'
      - id: tier
        run: |
          if [[ "${{ github.base_ref }}" == "main" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "is-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-main=false" >> "$GITHUB_OUTPUT"
          fi
      # A promotion PR usually holds a tree an earlier run already tested:
      # a merge_group or push run tests exactly the commit it names. A
      # merge_group run often holds the tree its PR's last run tested, when the
      # base hasn't moved since; that run recorded the tree as a
      # ci-tree-<tree> artifact (below). When a passing run tested this tree,
      # the build, lint, format, typecheck and unit-test jobs skip
      # (qualithm/pm#2856). Any failed lookup means no reuse.
      - id: reuse
        if:
          github.event_name == 'merge_group' || (github.event_name == 'pull_request' &&
          github.base_ref != 'development')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || exit 0
          if [[ "$EVENT" == "merge_group" ]]; then
            # Only this repo's CI, run on a pull_request, that passed.
            workflow=$(gh api "repos/$REPO/actions/workflows/ci.yaml" --jq .id) || exit 0
            ids=$(gh api "repos/$REPO/actions/artifacts?name=ci-tree-$tree&per_page=20" \
              --jq '.artifacts[] | select(.expired | not) | .workflow_run.id' || true)
            for id in $ids; do
              passed=$(gh api "repos/$REPO/actions/runs/$id" \
                --jq "select(.workflow_id == $workflow and .event == \"pull_request\" and .conclusion == \"success\") | .id" || true)
              if [[ "$passed" == "$id" ]]; then
                echo "reuse=true" >> "$GITHUB_OUTPUT"
                echo "reusing the passing pull_request run $id, which tested tree $tree"
                exit 0
              fi
            done
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shas=$(gh api "repos/$REPO/actions/workflows/ci.yaml/runs?status=success&per_page=30" \
            --jq '.workflow_runs[] | select(.event == "merge_group" or .event == "push") | .head_sha' || true)
          for sha in $shas; do
            if [[ "$(gh api "repos/$REPO/git/commits/$sha" --jq .tree.sha || true)" == "$tree" ]]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "reusing the passing run on $sha, which tested tree $tree"
              exit 0
            fi
          done
          echo "reuse=false" >> "$GITHUB_OUTPUT"
      # A pull_request run records the tree it tests (the merge commit it
      # checked out) for the merge queue's lookup above.
      - name: Record the tested tree
        id: tested
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/ci-tree"
          echo "tree=$(cat "$RUNNER_TEMP/ci-tree")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: ci-tree-${{ steps.tested.outputs.tree }}
          path: ${{ runner.temp }}/ci-tree
          retention-days: 3
      # Every image reference in the repo must match the vendored dx registry.
      # Here so it runs on every event, docs included (a README can carry an
      # image reference too) without a job of its own (qualithm/pm#3010). A
      # repo with no vendored registry references no container image and skips.
      - name: Check image pins against the vendored dx registry
        run: |
          if [ ! -f .github/images/images.config ]; then
            echo "no vendored registry: repo references no container image; skipping"
            exit 0
          fi
          .github/images/images check --config .github/images/images.config .

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Format check
        # Only enforce gofmt on files we own; vendored upstream keeps its style.
        run: |
          out=$(gofmt -s -l ./*.go tempopb/pool.go internal/util/log/log.go)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: Tidy check
        run: |
          go mod tidy
          tidy_paths=(go.mod)
          [ -f go.sum ] && tidy_paths+=(go.sum)
          if ! git diff --exit-code "${tidy_paths[@]}"; then
            echo "go.mod / go.sum are not tidy. Run 'go mod tidy'."
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...

  coverage:
    name: Coverage
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run tests with coverage
        run: |
          if [ -n "$SKIP_TESTS" ]; then
            go test -race -count=1 -coverprofile=coverage.out -covermode=atomic -skip "$SKIP_TESTS" ./...
          else
            go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          fi
      - name: Enforce first-party coverage threshold
        run: |
          head -n1 coverage.out > coverage.firstparty.out
          if [ "NONE" = "NONE" ]; then
            echo "no first-party code in this repo; skipping first-party coverage gate"
            exit 0
          fi
          grep -E 'NONE' coverage.out \
            | grep -v '\.y\.go:' >> coverage.firstparty.out || true
          pct=$(go tool cover -func=coverage.firstparty.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "First-party coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 80.0) { print "first-party coverage below 80%"; exit 1 } }'
      - name: Split coverage into upstream profile
        run: |
          head -n1 coverage.out > coverage.upstream.out
          grep -E '^github.com/qualithm/traceql-syntax/(traceql|tempopb|internal)/' coverage.out \
            | grep -v '\.y\.go:' >> coverage.upstream.out || true
      - name: Fetch Codecov CLI
        id: codecov-cli
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          # A pinned GitHub release instead of the action's runtime download
          # from cli.codecov.io, whose TLS handshake fails from our runners.
          # Bump both values together.
          CODECOV_CLI_VERSION: v11.3.1
          CODECOV_CLI_SHA256: ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/codecov" \
            "https://github.com/codecov/codecov-cli/releases/download/$CODECOV_CLI_VERSION/codecovcli_linux"
          echo "$CODECOV_CLI_SHA256  $RUNNER_TEMP/codecov" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/codecov"
      - name: Upload coverage to Codecov (firstparty)
        id: codecov-firstparty
        if: ${{ !cancelled() && steps.codecov-cli.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.firstparty.out
          flags: firstparty
          fail_ci_if_error: true
      - name: Wait before retrying the Codecov upload (firstparty)
        if: ${{ !cancelled() && steps.codecov-firstparty.outcome == 'failure' }}
        run: sleep 30
      - name: Retry the Codecov upload (firstparty)
        id: codecov-firstparty-retry
        if: ${{ !cancelled() && steps.codecov-firstparty.outcome == 'failure' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.firstparty.out
          flags: firstparty
          fail_ci_if_error: true
      - name: Upload coverage to Codecov (upstream)
        id: codecov-upstream
        if: ${{ !cancelled() && steps.codecov-cli.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.upstream.out
          flags: upstream
          fail_ci_if_error: true
      - name: Wait before retrying the Codecov upload (upstream)
        if: ${{ !cancelled() && steps.codecov-upstream.outcome == 'failure' }}
        run: sleep 30
      - name: Retry the Codecov upload (upstream)
        id: codecov-upstream-retry
        if: ${{ !cancelled() && steps.codecov-upstream.outcome == 'failure' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.upstream.out
          flags: upstream
          fail_ci_if_error: true
      # Non-blocking by design: Codecov reports coverage, it never gates it, so
      # a Codecov outage must not fail CI Required. A missed upload surfaces
      # as a warning annotation and a job summary line instead.
      - name: Report a failed Codecov upload
        if:
          ${{ !cancelled() && ((steps.codecov-firstparty.outcome != 'success' &&
          steps.codecov-firstparty-retry.outcome != 'success') || (steps.codecov-upstream.outcome !=
          'success' && steps.codecov-upstream-retry.outcome != 'success')) }}
        run: |
          echo "::warning title=Codecov upload failed::coverage was not uploaded to Codecov after a retry"
          echo "Codecov upload failed after a retry. See the upload steps in this job." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  docs:
    name: Docs
    needs: changes
    # Full tier: the API docs build only on the main hop, where a release is
    # cut from. pkg.go.dev renders the doc comments on publish; this
    # fails first on a package whose docs don't build or that go vet rejects.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.is-main == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - name: Render every package's docs
        run: |
          set -euo pipefail
          go list ./... | while read -r pkg; do
            go doc -all "$pkg" >/dev/null
          done

  # Runs only when a job failed or was cancelled, and fails then. On a green
  # run it skips, which bills nothing and still satisfies the required check:
  # GitHub reports a job skipped by its `if` as successful (qualithm/pm#3010).
  ci-required:
    name: CI Required
    if: failure() || cancelled()
    needs: [changes, build, coverage, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify dependent jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' \
            || { echo "::error::One or more required jobs failed or were cancelled"; exit 1; }
