# Generated by dx/scripts/audit-sync from ci-templates/audit-go-vendored.yaml.
# Do not edit directly — change the template and re-run audit-sync.

name: Security Audit

# Advisory scans run daily; every job runs on Mondays and on a push that
# changes a dependency.
on:
  schedule:
    - cron: "0 6 * * 0,2-6" # Daily at 06:00 UTC, except Monday
    - cron: "0 6 * * 1" # Monday at 06:00 UTC: every job
  push:
    branches: [development, main]
    paths:
      - "**/go.mod"
      - "**/go.sum"
      - ".github/workflows/audit.yaml"
  workflow_dispatch: {}

# A newer push supersedes an older one; schedules queue apart from pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  GOVULNCHECK_VERSION: v1.3.0

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          # Never true: setup-go's key omits the workflow name, so caching here would
          # claim CI's key on the default branch with a smaller build footprint. CI
          # would then hit it, restore too little, and skip saving the fuller cache.
          cache: false
      # govulncheck ships no binary: build it once per version and Go, then
      # restore it (qualithm/pm#3019).
      - name: Restore govulncheck
        id: govulncheck
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/go/bin/govulncheck
          key:
            govulncheck-${{ env.GOVULNCHECK_VERSION }}-go1.27.3-${{ runner.os }}-${{ runner.arch }}
      - name: Install govulncheck
        if: steps.govulncheck.outputs.cache-hit != 'true'
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: Run govulncheck
        id: scan
        continue-on-error: true
        run: govulncheck ./...
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: govulncheck found a vulnerability"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: govulncheck found a vulnerability"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1

  gosec:
    name: Security Scan (gosec)
    # Weekly: what it checks changes only with the code or dependencies.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          # See the govulncheck job: caching here would poison CI's setup-go key.
          cache: false
      - name: Run gosec
        id: scan
        continue-on-error: true
        uses: securego/gosec@9e6a9843d7a4a6e3e9a8539b02612c8a4aa3f889 # v2.27.1
        env:
          GOTOOLCHAIN: auto
        with:
          args: -exclude-dir=traceql -exclude-dir=tempopb -exclude-dir=internal ./...
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: gosec flagged a finding"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: gosec flagged a finding"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1

  fuzz:
    name: Fuzz
    # Weekly or on dispatch, with the corpus carried from run to run; a push would
    # hold every promotion behind the fuzz time (qualithm/pm#2119).
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FUZZ_TIME: 10m
    steps:
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          # See the govulncheck job: caching here would poison CI's setup-go key.
          cache: false
      - name: Locate the fuzz corpus
        id: corpus
        run: echo "path=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      # Each run saves under a new key and restores the newest, so the corpus grows.
      - name: Restore the fuzz corpus
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.corpus.outputs.path }}
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run every fuzz target
        id: scan
        continue-on-error: true
        run: |
          set -uo pipefail
          status=0
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              echo "::group::${target} in ${pkg}"
              if ! go test -run '^$' -fuzz "^${target}\$" -fuzztime "$FUZZ_TIME" "$pkg" 2>&1 | tee fuzz.log; then
                status=1
                {
                  echo "### ${target} in \`${pkg}\`"
                  echo
                  echo '```'
                  grep -v '^fuzz: elapsed' fuzz.log | tail -40
                  echo '```'
                  echo
                } >> fuzz-report.md
              fi
              echo "::endgroup::"
            done
          done
          exit "$status"
      - name: Save the fuzz corpus
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.corpus.outputs.path }}
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload the crashers
        id: crashers
        if: steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          retention-days: 90
      - name: Write the report
        id: report
        if: steps.scan.outcome == 'failure'
        env:
          ARTIFACT_URL: ${{ steps.crashers.outputs.artifact-url }}
        run: |
          {
            echo "body<<FUZZ_REPORT_EOF"
            echo "A fuzz target failed. Download the crashers (${ARTIFACT_URL}) into the"
            echo "repository root, then reproduce with \`go test -run '<target>/<file>' <package>\`."
            echo
            cat fuzz-report.md
            echo "FUZZ_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: a fuzz target found a crasher"
          body: ${{ steps.report.outputs.body }}
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: a fuzz target found a crasher"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1

  sync-check:
    name: Upstream Sync Drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          # See the govulncheck job: caching here would poison CI's setup-go key.
          cache: false
      - name: Resolve pinned Tempo version
        id: pin
        run: |
          set -euo pipefail
          src=scripts/sync-upstream.sh
          # Matches any `<NAME>_VERSION="${1:-<version>}"` pin, so a new vendored
          # repo doesn't have to teach this template its variable name. The capture
          # is anchored on the closing `}"` rather than trimmed with a greedy `.*-`,
          # which would truncate a pseudo-version at its last hyphen.
          pin_var=$(sed -n 's/^\([A-Z][A-Z0-9_]*_VERSION\)="[$][{]1:-.*/\1/p' "$src" | head -1)
          ver=$(sed -n 's/^[A-Z][A-Z0-9_]*_VERSION="[$][{]1:-\(.*\)[}]".*/\1/p' "$src" | head -1)
          if [[ -z "$ver" ]]; then
            echo "::error::Could not resolve the pinned Tempo version from ${src}."
            echo "Expected a line of the form '<NAME>_VERSION=\"\${1:-<version>}\"'."
            echo "Matched variable: ${pin_var:-<none>}"
            exit 1
          fi
          echo "Pinned Tempo version: $ver (from ${pin_var} in ${src})"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Prime module cache
        env:
          PIN_VERSION: ${{ steps.pin.outputs.version }}
        run: go mod download "github.com/grafana/tempo@${PIN_VERSION}"
      - name: Re-run sync script
        env:
          PIN_VERSION: ${{ steps.pin.outputs.version }}
        run: bash scripts/sync-upstream.sh "$PIN_VERSION"
      - name: Fail on drift
        id: scan
        continue-on-error: true
        env:
          PIN_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          if ! git diff --exit-code; then
            echo "::error::Vendored upstream files are out of sync with Tempo ${PIN_VERSION}."
            echo "Run 'scripts/sync-upstream.sh' locally and commit the result."
            exit 1
          fi
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title:
            "${{ github.event.repository.name }}: vendored Tempo sources drifted from
            upstream"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title:
            "${{ github.event.repository.name }}: vendored Tempo sources drifted from
            upstream"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      # Every branch's whole history: a secret a later commit removed is still leaked.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          # Pinned release plus the sha256 of its linux_x64 tarball from the
          # release's checksums file. Bump both values together.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # gitleaks loads a committed .gitleaks.toml on its own, so its allowlist is
      # the only exemption. --verbose lists each finding's rule, file, line and
      # commit for triage, --redact masks the secret in it, and no report file is
      # written or uploaded.
      - name: Scan the history for secrets
        id: scan
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 --no-banner --log-opts=--all .
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: gitleaks found a leaked secret"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: gitleaks found a leaked secret"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
